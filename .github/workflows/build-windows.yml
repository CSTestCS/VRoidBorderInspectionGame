name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/package-win.js
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: HavenCheckpoint-win32-x64
          path: dist/HavenCheckpoint-win32-x64
